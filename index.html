<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>impflanguage</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#88786f] text-black font-sans selection:bg-[#E63946] selection:text-white">
    <header class="p-6 text-[13px]">
        <span class="font-medium tracking-tight text-black">impflanguage</span>
    </header>

    <main class="flex-1 flex flex-col items-center w-full px-6 pt-12 pb-24">
        <div class="w-full max-w-[600px] flex flex-col" id="releases-container">
            <!-- Content generated by script -->
        </div>
        
        <button onclick="copyCode()" class="mt-12 px-4 py-2 border border-black/20 text-[10px] font-mono uppercase tracking-widest hover:bg-black hover:text-white transition-colors">
            Copy Code
        </button>
    </main>

    <footer class="p-6 text-[11px] text-black/50">
        © 2026 impflanguage
    </footer>

    <script>
        function copyCode() {
            const code = document.documentElement.outerHTML;
            const textarea = document.createElement('textarea');
            textarea.value = code;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            alert('Code copied to clipboard!');
        }

        const releases = [
            { id: 'IMP-001', title: 'burden', date: '2026.05.22' },
            { id: 'IMP-002', title: 'silence', date: '2026.05.22' },
            { id: 'IMP-003', title: 'I’ve moved', date: '2026.05.22' },
            { id: 'IMP-004', title: 'remember', date: '2026.05.22' },
            { id: 'IMP-005', title: 'go on', date: '2026.05.22' },
            { id: 'IMP-006', title: 'six more', date: '2026.05.22' },
        ];

        const container = document.getElementById('releases-container');

        releases.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = "flex flex-col mb-6";
            wrapper.innerHTML = `
                <button onclick="toggleExpand('${item.id}')" class="flex flex-col items-start gap-0 group text-left py-1">
                    <span class="text-[10px] text-black/50 font-mono tracking-widest uppercase leading-none">${item.date}</span>
                    <span id="title-${item.id}" class="text-[14px] font-medium tracking-tight text-black/50 hover:text-black transition-colors">${item.title}</span>
                </button>
                <div id="container-${item.id}" class="grid transition-all duration-[600ms] ease-in-out grid-rows-[0fr]">
                    <div class="overflow-hidden">
                        <div class="pt-3">
                            <div class="w-full aspect-video bg-black relative cursor-pointer group overflow-hidden" onclick="togglePlay('${item.id}')">
                                <video id="video-${item.id}" class="w-full h-full object-cover" playsinline ontimeupdate="updateProgress('${item.id}')">
                                    <source src="${item.id}.mp4" type="video/mp4">
                                </video>
                                <div id="play-overlay-${item.id}" class="absolute inset-0 flex items-center justify-center bg-black/20">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="white" stroke="white" stroke-width="1"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                                </div>
                                
                                <button onclick="event.stopPropagation(); toggleMute('${item.id}')" class="absolute bottom-5 right-3 z-20 text-white p-1">
                                    <div class="relative w-[18px] h-[18px] flex items-center justify-center">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon></svg>
                                        <div id="mute-x-${item.id}" class="absolute inset-0 hidden items-center justify-center">
                                            <div class="w-[12px] h-[1px] bg-white rotate-45 absolute"></div>
                                        </div>
                                    </div>
                                </button>

                                <div class="absolute bottom-0 left-0 w-full h-[5px] bg-white/20 z-10 cursor-pointer group" onclick="event.stopPropagation(); seek('${item.id}', event)">
                                    <div id="progress-${item.id}" class="h-full bg-white pointer-events-none" style="width: 0%"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.appendChild(wrapper);
        });

        function toggleExpand(id) {
            const container = document.getElementById('container-' + id);
            const title = document.getElementById('title-' + id);
            const video = document.getElementById('video-' + id);
            const overlay = document.getElementById('play-overlay-' + id);
            
            if (container.classList.contains('grid-rows-[0fr]')) {
                container.classList.replace('grid-rows-[0fr]', 'grid-rows-[1fr]');
                title.classList.add('text-black', 'underline');
                video.play();
                overlay.classList.add('hidden');
            } else {
                container.classList.replace('grid-rows-[1fr]', 'grid-rows-[0fr]');
                title.classList.remove('text-black', 'underline');
                video.pause();
                overlay.classList.remove('hidden');
            }
        }

        function togglePlay(id) {
            const video = document.getElementById('video-' + id);
            const overlay = document.getElementById('play-overlay-' + id);
            if (video.paused) {
                video.play();
                overlay.classList.add('hidden');
            } else {
                video.pause();
                overlay.classList.remove('hidden');
            }
        }

        function updateProgress(id) {
            const video = document.getElementById('video-' + id);
            const bar = document.getElementById('progress-' + id);
            if (video.duration) {
                bar.style.width = (video.currentTime / video.duration) * 100 + '%';
            }
        }

        function seek(id, e) {
            const video = document.getElementById('video-' + id);
            const bar = e.currentTarget;
            const rect = bar.getBoundingClientRect();
            const clickPosition = e.clientX - rect.left;
            const percentage = clickPosition / rect.width;
            
            if (video.duration) {
                video.currentTime = percentage * video.duration;
                document.getElementById('progress-' + id).style.width = (percentage * 100) + '%';
            }
        }

        function toggleMute(id) {
            const video = document.getElementById('video-' + id);
            const muteX = document.getElementById('mute-x-' + id);
            video.muted = !video.muted;
            if (video.muted) {
                muteX.classList.remove('hidden');
                muteX.classList.add('flex');
            } else {
                muteX.classList.add('hidden');
                muteX.classList.remove('flex');
            }
        }
    </script>
</body>
</html>
