<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>impflanguage</title>
   <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#88786f] text-black font-sans selection:bg-[#E63946] selection:text-white">
   <header class="p-6 text-[13px]">
       <span class="font-medium tracking-tight text-black">impflanguage</span>
   </header>

   <main class="flex-1 flex flex-col items-center w-full px-6 pt-12 pb-24">
       <div class="w-full max-w-[600px] flex flex-col" id="releases-container">
           <!-- Content generated by script -->
       </div>
   </main>

   <footer class="p-6 text-[11px] text-black/50">
       © 2026 impflanguage
   </footer>

   <script>
       // Mapping your Vimeo IDs to the release IDs
       const releases = [
           { id: 'IMP-001', title: 'burden', date: '2026.05.22', vimeoId: '1194750717' },
           { id: 'IMP-002', title: 'silence', date: '2026.05.22', vimeoId: '1194747890' },
           { id: 'IMP-003', title: 'I’ve moved', date: '2026.05.22', vimeoId: '1194747889' },
           { id: 'IMP-004', title: 'remember', date: '2026.05.22', vimeoId: '1194748140' },
           { id: 'IMP-005', title: 'go on', date: '2026.05.22', vimeoId: '1194747887' },
           { id: 'IMP-006', title: 'six more', date: '2026.05.22', vimeoId: '1194747888' },
       ];

       const container = document.getElementById('releases-container');

       releases.forEach(item => {
           const wrapper = document.createElement('div');
           wrapper.className = "flex flex-col mb-6";
           // Note: We use the Vimeo player embed URL format for reliable playback
           wrapper.innerHTML = `
               <button onclick="toggleExpand('${item.id}')" class="flex flex-col items-start gap-0 group text-left py-1">
                   <span class="text-[10px] text-black/50 font-mono tracking-widest uppercase leading-none">${item.date}</span>
                   <span id="title-${item.id}" class="text-[14px] font-medium tracking-tight text-black/50 hover:text-black transition-colors">${item.title}</span>
               </button>
               <div id="container-${item.id}" class="grid transition-all duration-[600ms] ease-in-out grid-rows-[0fr]">
                   <div class="overflow-hidden">
                       <div class="pt-3">
                           <div class="w-full aspect-video bg-black relative">
                               <iframe
                                   id="video-${item.id}"
                                   src="https://player.vimeo.com/video/${item.vimeoId}?autoplay=0&muted=0"
                                   class="w-full h-full"
                                   frameborder="0"
                                   allow="autoplay; fullscreen; picture-in-picture"
                                   allowfullscreen>
                               </iframe>
                           </div>
                       </div>
                   </div>
               </div>
           `;
           container.appendChild(wrapper);
       });

       function toggleExpand(id) {
           const container = document.getElementById('container-' + id);
           const title = document.getElementById('title-' + id);
           
           if (container.classList.contains('grid-rows-[0fr]')) {
               container.classList.replace('grid-rows-[0fr]', 'grid-rows-[1fr]');
               title.classList.add('text-black', 'underline');
           } else {
               container.classList.replace('grid-rows-[1fr]', 'grid-rows-[0fr]');
               title.classList.remove('text-black', 'underline');
           }
       }
   </script>
</body>
</html>
